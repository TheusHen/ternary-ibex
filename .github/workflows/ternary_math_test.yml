import random
import sys

print('=== Comprehensive Ternary Math Tests ===')

# Ternary encoding functions
def encode_trit(val):
    if val == -1: return 0b00
    elif val == 0: return 0b01  
    elif val == 1: return 0b10
    else: return 0b01

def decode_trit(encoded):
    if encoded == 0b00: return -1
    elif encoded == 0b01: return 0
    elif encoded == 0b10: return 1
    else: return 0

def encode_ternary_register(trits):
    result = 0
    for i, trit in enumerate(trits[:16]):  # 16 trits max
        result |= (encode_trit(trit) << (i * 2))
    return result

def decode_ternary_register(encoded):
    trits = []
    for i in range(16):
        trit_encoded = (encoded >> (i * 2)) & 0b11
        trits.append(decode_trit(trit_encoded))
    return trits

# Ternary arithmetic operations
def ternary_add_trit(a, b):
    result = a + b
    if result > 1: return 1   # Clamp overflow
    if result < -1: return -1 # Clamp underflow
    return result

def ternary_mul_trit(a, b):
    return a * b

def ternary_add_register(a_encoded, b_encoded):
    a_trits = decode_ternary_register(a_encoded)
    b_trits = decode_ternary_register(b_encoded)
    result_trits = []
    
    for i in range(16):
        result_trits.append(ternary_add_trit(a_trits[i], b_trits[i]))
    
    return encode_ternary_register(result_trits)

def ternary_mul_register(a_encoded, b_encoded):
    a_trits = decode_ternary_register(a_encoded)
    b_trits = decode_ternary_register(b_encoded)
    result_trits = []
    
    for i in range(16):
        result_trits.append(ternary_mul_trit(a_trits[i], b_trits[i]))
    
    return encode_ternary_register(result_trits)

# Neural operations
def neural_multiply_accumulate(weights_encoded, inputs_encoded):
    weights = decode_ternary_register(weights_encoded)
    inputs = decode_ternary_register(inputs_encoded)
    
    accumulator = 0
    for i in range(16):
        accumulator += weights[i] * inputs[i]
    
    return accumulator

def neural_activate(value):
    if value > 1: return 1
    elif value < -1: return -1
    else: return 0

# Test cases
print('Running 1000 comprehensive test cases...')

tests_passed = 0
tests_failed = 0

for test_num in range(1000):
    # Generate random ternary values
    trits_a = [random.choice([-1, 0, 1]) for _ in range(16)]
    trits_b = [random.choice([-1, 0, 1]) for _ in range(16)]
    
    a = encode_ternary_register(trits_a)
    b = encode_ternary_register(trits_b)
    
    # Test addition
    result_add = ternary_add_register(a, b)
    decoded_result = decode_ternary_register(result_add)
    
    # Verify addition manually
    expected_add = []
    for i in range(16):
        expected_add.append(ternary_add_trit(trits_a[i], trits_b[i]))
    
    if decoded_result == expected_add:
        tests_passed += 1
    else:
        tests_failed += 1
        if tests_failed <= 5:  # Show first few failures
            print(f'FAIL: Addition test {test_num}')
    
    # Test multiplication
    result_mul = ternary_mul_register(a, b)
    decoded_result = decode_ternary_register(result_mul)
    
    expected_mul = []
    for i in range(16):
        expected_mul.append(ternary_mul_trit(trits_a[i], trits_b[i]))
    
    if decoded_result == expected_mul:
        tests_passed += 1
    else:
        tests_failed += 1
        if tests_failed <= 5:
            print(f'FAIL: Multiplication test {test_num}')
    
    # Test neural operations every 10th iteration
    if test_num % 10 == 0:
        accumulation = neural_multiply_accumulate(a, b)
        activation = neural_activate(accumulation)
        
        # Just verify the neural ops complete
        tests_passed += 1

print(f'\\nTest Results:')
print(f'Passed: {tests_passed}')
print(f'Failed: {tests_failed}')
print(f'Total:  {tests_passed + tests_failed}')

if tests_failed == 0:
    print('🎉 ALL COMPREHENSIVE TESTS PASSED! 🎉')
else:
    print(f'❌ {tests_failed} tests failed')

# Performance simulation
print('\\n=== Performance Simulation ===')
import time

# Binary simulation
start = time.time()
binary_result = 0
for i in range(10000):
    a = random.randint(0, 0xFFFFFFFF)
    b = random.randint(0, 0xFFFFFFFF)
    binary_result += a * b
binary_time = time.time() - start

# Ternary simulation  
start = time.time()
ternary_result = 0
for i in range(10000):
    trits_a = [random.choice([-1, 0, 1]) for _ in range(16)]
    trits_b = [random.choice([-1, 0, 1]) for _ in range(16)]
    a = encode_ternary_register(trits_a)
    b = encode_ternary_register(trits_b)
    ternary_result += ternary_mul_register(a, b)
ternary_time = time.time() - start

speedup = binary_time / ternary_time if ternary_time > 0 else 1.0
print(f'Binary time:   {binary_time:.4f}s')
print(f'Ternary time:  {ternary_time:.4f}s') 
print(f'Speedup:       {speedup:.2f}x')

print('\\n✓ Comprehensive math tests completed')
sys.exit(0 if tests_failed == 0 else 1)
