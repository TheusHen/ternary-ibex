workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - format
  - synth
  - formal
  - test
  - perf
  - regression
  - integration
  - docs
  - package
  - deploy
  - report
  - notify

variables:
  GIT_DEPTH: "0"
  FUSESOC_CACHE: "$CI_PROJECT_DIR/.cache/fusesoc"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  NODE_ENV: "production"
  DEBIAN_FRONTEND: "noninteractive"
  ARTIFACTS_EXPIRE: "14 days"

default:
  image: ubuntu:22.04
  interruptible: true
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends git ca-certificates curl python3 python3-pip python3-venv bc build-essential pkg-config time jq sudo
    - grep -vE '^(#|$)' ci/vars.env >> .env.ci || true
    - set -a; [ -f .env.ci ] && source .env.ci; set +a
    - ci/install-build-deps.sh
    - mkdir -p "$FUSESOC_CACHE" "$PIP_CACHE_DIR"
  cache:
    key: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/fusesoc
      - .cache/pip
    policy: pull-push

.ibex_artifacts:
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - build/
      - *.log
      - *.md

# -----------------------------------------------------------------------------
# Lint and formatting
# -----------------------------------------------------------------------------
verible_pr_lint:
  stage: lint
  extends: [.ibex_artifacts]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - verible_config="vendor/lowrisc_ip/lint/tools/veriblelint/lowrisc-styleguide.rules.verible_lint"
    - echo "Using verible config: ${verible_config}"
    - verible-verilog-lint \
        --config_file "${verible_config}" \
        --waiver_files lint/verible_waiver.vbw \
      $(find rtl dv formal \( -name '*.sv' -o -name '*.svh' \))

ternary_lint:
  stage: lint
  extends: [.ibex_artifacts]
  rules:
    - changes:
        - rtl/ibex_ternary_*.sv
        - rtl/ibex_neural_*.sv
        - dv/mhx_ternary_*
        - examples/mhx_*
        - .github/workflows/ternary-ci.yml
  script:
    - fusesoc --cores-root . run --target=lint --tool=verilator lowrisc:ibex:mhx_ternary_test
    - fusesoc --cores-root . run --target=lint --tool=veriblelint lowrisc:ibex:mhx_ternary_test

ternary_security_scan:
  stage: lint
  extends: [.ibex_artifacts]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
  script:
    - grep -r "password\|secret\|key" rtl/ibex_ternary_*.sv rtl/ibex_neural_*.sv || true
    - grep -r "time\|delay\|wait" rtl/ibex_ternary_*.sv rtl/ibex_neural_*.sv || true

format_ternary:
  stage: format
  extends: [.ibex_artifacts]
  rules:
    - changes:
        - rtl/ibex_ternary_*.sv
        - rtl/ibex_neural_*.sv
  script:
    - verible-verilog-format --check rtl/ibex_ternary_*.sv rtl/ibex_neural_*.sv || true

# -----------------------------------------------------------------------------
# Core Ibex CI (mirrors .github/workflows/ci.yml)
# -----------------------------------------------------------------------------
ibex_core_ci:
  stage: test
  extends: [.ibex_artifacts]
  script:
    - echo "Exporting env from ci/vars.env if present"
    - grep -vE '^(#|$)' ci/vars.env >> .env.ci || true
    - set -a; [ -f .env.ci ] && source .env.ci; set +a
    - ci/install-build-deps.sh
    - echo "PATH: $PATH"; python3 --version; fusesoc --version; verilator --version
    - |
      set +e
      fusesoc --cores-root . run --no-export --target=format --tool=veribleformat lowrisc:ibex:ibex_top_tracing
      git diff --no-pager || true
      git reset --hard HEAD
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        base_ref=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-origin/main}
        git fetch origin "${base_ref}" || true
        changed=$(git diff --name-only "origin/${base_ref}"...HEAD | grep -v '^vendor' | grep -E '\.(cpp|cc|c|h)$' || true)
        if [ -n "$changed" ]; then
          git diff -U0 "origin/${base_ref}"...HEAD $changed | clang-format-diff -p1 | tee clang-format-output
          test ! -s clang-format-output
        fi
      fi
    - fusesoc --cores-root=. run --target=sim --tool=verilator lowrisc:ibex:tb_cs_registers
    - mkdir -p build && cd build && git clone https://github.com/riscv/riscv-compliance.git && cd riscv-compliance && git checkout "$RISCV_COMPLIANCE_GIT_VERSION"
    - make -C ./examples/sw/benchmarks/coremark SUPPRESS_PCOUNT_DUMP=1
    - make -C ./examples/sw/simple_system/pmp_smoke_test
    - make -C ./examples/sw/simple_system/dit_test
    - make -C ./examples/sw/simple_system/dummy_instr_test
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - build/
      - clang-format-output

ibex_rtl_matrix:
  stage: test
  extends: [.ibex_artifacts]
  needs:
    - ibex_core_ci
  parallel:
    matrix:
      - IBEX_CONFIG: ["small", "opentitan", "maxperf", "maxperf-pmp-bmbalanced", "maxperf-pmp-bmfull", "experimental-branch-predictor"]
  script:
    - export IBEX_CONFIG_OPTS=$(./util/ibex_config.py ${IBEX_CONFIG} fusesoc_opts)
    - fusesoc --cores-root . run --target=lint --tool=verilator lowrisc:ibex:ibex_top_tracing $IBEX_CONFIG_OPTS
    - fusesoc --cores-root . run --target=lint --tool=veriblelint lowrisc:ibex:ibex_top_tracing $IBEX_CONFIG_OPTS
    - fusesoc --cores-root=. run --target=sim --setup --build lowrisc:ibex:ibex_riscv_compliance $IBEX_CONFIG_OPTS
    - export TARGET_SIM=$PWD/build/lowrisc_ibex_ibex_riscv_compliance_0.1/sim-verilator/Vibex_riscv_compliance
    - export RISCV_PREFIX=riscv32-unknown-elf-
    - export RISCV_TARGET=ibex
    - export RISCV_DEVICE=rv32imc
    - |
      fail=0
      for isa in rv32i rv32im rv32imc rv32Zicsr rv32Zifencei; do
        make -C build/riscv-compliance RISCV_ISA=$isa 2>&1 | tee run.log
        if [ ${PIPESTATUS[0]} != 0 ]; then
          fail=1
        fi
      done
      exit $fail
    - |
      source ci/setup-cosim.sh
      fusesoc --cores-root=. run --target=sim --setup --build lowrisc:ibex:ibex_simple_system_cosim $IBEX_CONFIG_OPTS
      ./ci/run-cosim-test.sh --skip-pass-check CoreMark examples/sw/benchmarks/coremark/coremark.elf
      if ./util/ibex_config.py ${IBEX_CONFIG} query_fields PMPEnable | grep -q 'PMPEnable=1'; then
        ./ci/run-cosim-test.sh --skip-pass-check pmp_smoke examples/sw/simple_system/pmp_smoke_test/pmp_smoke_test.elf
      fi
      if ./util/ibex_config.py ${IBEX_CONFIG} query_fields SecureIbex | grep -q 'SecureIbex=1'; then
        ./ci/run-cosim-test.sh dit_test examples/sw/simple_system/dit_test/dit_test.elf
        ./ci/run-cosim-test.sh dummy_instr_test examples/sw/simple_system/dummy_instr_test/dummy_instr_test.elf
      fi
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - build/**
      - run.log

# -----------------------------------------------------------------------------
# Ternary CI (mirrors ternary-ci and ternary_math_test workflows)
# -----------------------------------------------------------------------------
ternary_synthesis:
  stage: synth
  extends: [.ibex_artifacts]
  needs:
    - ternary_lint
  script:
    - yosys -p "read_systemverilog -I rtl rtl/ibex_pkg.sv rtl/ibex_ternary_alu.sv; hierarchy -top ibex_ternary_alu; proc; opt; fsm; opt; memory; opt; synth -top ibex_ternary_alu; stat;" 2>&1 | tee ternary_alu_synth.log
    - yosys -p "read_systemverilog -I rtl rtl/ibex_pkg.sv rtl/ibex_neural_unit.sv; hierarchy -top ibex_neural_unit; proc; opt; fsm; opt; memory; opt; synth -top ibex_neural_unit; stat;" 2>&1 | tee neural_unit_synth.log

ternary_formal:
  stage: formal
  extends: [.ibex_artifacts]
  needs:
    - ternary_lint
  script:
    - set +e
    - fusesoc --cores-root . run --target=formal --tool=symbiyosys lowrisc:ibex:mhx_ternary_test || true
    - verilator --lint-only --top-module ibex_ternary_alu -y rtl -y vendor/lowrisc_ip/ip/prim/rtl -y vendor/lowrisc_ip/dv/sv/dv_utils +incdir+rtl +incdir+vendor/lowrisc_ip/ip/prim/rtl +incdir+vendor/lowrisc_ip/dv/sv/dv_utils +define+SYNTHESIS rtl/ibex_pkg.sv rtl/ibex_ternary_alu.sv
    - verilator --lint-only --top-module ibex_ternary_regfile -y rtl -y vendor/lowrisc_ip/ip/prim/rtl -y vendor/lowrisc_ip/dv/sv/dv_utils +incdir+rtl +incdir+vendor/lowrisc_ip/ip/prim/rtl +incdir+vendor/lowrisc_ip/dv/sv/dv_utils +define+SYNTHESIS rtl/ibex_pkg.sv rtl/ibex_ternary_regfile.sv
    - verilator --lint-only --top-module ibex_neural_unit -y rtl -y vendor/lowrisc_ip/ip/prim/rtl -y vendor/lowrisc_ip/dv/sv/dv_utils +incdir+rtl +incdir+vendor/lowrisc_ip/ip/prim/rtl +incdir+vendor/lowrisc_ip/dv/sv/dv_utils +define+SYNTHESIS rtl/ibex_pkg.sv rtl/ibex_neural_unit.sv

ternary_unit_tests:
  stage: test
  extends: [.ibex_artifacts]
  needs:
    - ternary_lint
  parallel:
    matrix:
      - SUITE: ["alu", "neural", "regfile", "integration"]
  script:
    - fusesoc --cores-root . run --target=sim --tool=verilator --setup --build lowrisc:ibex:mhx_ternary_test
    - cd build/lowrisc_ibex_mhx_ternary_test_0.1/sim-verilator
    - |
      case "${SUITE}" in
        alu) TEST_PARAMS="+TEST_SUITE=ALU +MAX_CYCLES=10000";;
        neural) TEST_PARAMS="+TEST_SUITE=NEURAL +MAX_CYCLES=20000";;
        regfile) TEST_PARAMS="+TEST_SUITE=REGFILE +MAX_CYCLES=5000";;
        integration) TEST_PARAMS="+TEST_SUITE=INTEGRATION +MAX_CYCLES=50000";;
      esac
      timeout 600s ./Vmhx_ternary_test $TEST_PARAMS

ternary_functional:
  stage: test
  extends: [.ibex_artifacts]
  needs:
    - ternary_unit_tests
  script:
    - ./run_ternary_tests.sh

ternary_performance:
  stage: perf
  extends: [.ibex_artifacts]
  needs:
    - ternary_functional
  script:
    - chmod +x ci/validate-performance.sh
    - ./ci/validate-performance.sh
    - python3 util/ternary_performance_analysis.py

ternary_regression:
  stage: regression
  extends: [.ibex_artifacts]
  needs:
    - ternary_formal
    - ternary_performance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - bash run_ternary_tests.sh --regression

ternary_integration:
  stage: integration
  extends: [.ibex_artifacts]
  needs:
    - ternary_synthesis
    - ternary_performance
  script:
    - fusesoc --cores-root=. run --target=sim --setup --build lowrisc:ibex:ibex_core --TernarySupport=true || true
    - |
      if grep -q "OPCODE_TERNARY\|OPCODE_NEURAL" rtl/ibex_decoder.sv; then echo "Decoder ok"; else exit 1; fi
      if grep -q "ternary_en_id\|neural_en_id" rtl/ibex_core.sv; then echo "Core signals ok"; else exit 1; fi
      if grep -q "ternary_op_e\|neural_op_e" rtl/ibex_pkg.sv; then echo "Pkg types ok"; else exit 1; fi

ternary_math_validation:
  stage: test
  extends: [.ibex_artifacts]
  needs:
    - ternary_lint
  script:
    - fusesoc --cores-root . run --target=sim --tool=verilator --setup --build lowrisc:ibex:mhx_ternary_test
    - cd build/lowrisc_ibex_mhx_ternary_test_0.1/sim-verilator
    - timeout 300s ./Vmhx_ternary_test +MAX_CYCLES=50000
    - cd $CI_PROJECT_DIR
    - python3 util/ternary_mathematical_validation.py

# -----------------------------------------------------------------------------
# Floorplan generation (mirrors floorplan-generation workflow)
# -----------------------------------------------------------------------------
floorplan_generate:
  stage: docs
  extends: [.ibex_artifacts]
  rules:
    - changes:
        - 'rtl/**/*.sv'
        - 'syn/**'
        - 'openlane/**'
        - 'docs/**'
        - '.github/workflows/floorplan-generation.yml'
    - when: manual
  script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends python3-pip python3-pil imagemagick graphicsmagick
    - pip3 install pillow matplotlib numpy gdspy
    - mkdir -p build/floorplan
    - python3 <<'PYTHON'
import matplotlib.pyplot as plt
import matplotlib.patches as mpatches
from matplotlib.patches import Rectangle, FancyBboxPatch
import numpy as np
fig, ax = plt.subplots(figsize=(16, 12), dpi=300)
fig.patch.set_facecolor('white')
ax.set_facecolor('#f8f9fa')
chip_width, chip_height = 10, 10
components = {
    'Core Pipeline': {'pos': (0.5, 6.5, 4.5, 3), 'color': '#4285f4'},
    'Ternary ALU': {'pos': (5.5, 7.5, 2, 2), 'color': '#34a853'},
    'Neural Unit': {'pos': (8.0, 7.5, 1.8, 2), 'color': '#fbbc04'},
    'Register File': {'pos': (0.5, 3.5, 3, 2.5), 'color': '#ea4335'},
    'Memory Interface': {'pos': (4.0, 3.5, 3, 2.5), 'color': '#9334ea'},
    'Control & Debug': {'pos': (7.5, 3.5, 2.3, 2.5), 'color': '#00bcd4'},
    'I-Cache': {'pos': (0.5, 0.5, 4.5, 2.5), 'color': '#ff6f00'},
    'Clock & Power': {'pos': (5.5, 0.5, 4.3, 2.5), 'color': '#607d8b'},
}
ax.add_patch(FancyBboxPatch((0, 0), chip_width, chip_height, boxstyle="round,pad=0.1", edgecolor='#263238', linewidth=3, facecolor='none', zorder=1))
for name, data in components.items():
    x, y, w, h = data['pos']
    color = data['color']
    ax.add_patch(FancyBboxPatch((x, y), w, h, boxstyle="round,pad=0.05", edgecolor='#263238', linewidth=2, facecolor=color, alpha=0.7, zorder=3))
    ax.text(x + w/2, y + h - 0.2, name, ha='center', va='top', fontsize=11, fontweight='bold', color='white', zorder=4)
ax.set_xlim(-0.5, 11.5)
ax.set_ylim(-0.5, 10.5)
ax.set_aspect('equal')
ax.axis('off')
plt.tight_layout()
plt.savefig('build/floorplan/mhx_floorplan.png', dpi=300, bbox_inches='tight', facecolor='white', edgecolor='none')
PYTHON
    - python3 <<'PYTHON'
from PIL import Image
img = Image.open('build/floorplan/mhx_floorplan.png')
img.thumbnail((800, 800))
img.save('build/floorplan/mhx_floorplan_thumb.png', 'PNG', optimize=True)
PYTHON
    - mkdir -p docs/images
    - cp build/floorplan/mhx_floorplan*.png docs/images/
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - build/floorplan/
      - docs/images/mhx_floorplan*.png

# -----------------------------------------------------------------------------
# Documentation website (mirrors deploy-website workflow)
# -----------------------------------------------------------------------------
collect_site_data:
  stage: package
  extends: [.ibex_artifacts]
  needs:
    - ibex_core_ci
    - ternary_integration
  script:
    - mkdir -p build/ci-data build/coverage build/performance build/floorplan
    - if [ -f "ci/performance_baseline.json" ]; then cp ci/performance_baseline.json build/performance/; fi
    - if [ -f "docs/images/mhx_floorplan.png" ]; then cp docs/images/mhx_floorplan.png build/floorplan/; fi
    - cat > build/ci-status.json <<'EOF'
{
  "overall": "passing",
  "tests": {"passing": 0, "failing": 0, "total": 0}
}
EOF
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - build/

build_website:
  stage: package
  image: node:20-bullseye
  needs:
    - collect_site_data
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/npm
  before_script:
    - npm install -g npm@latest
  script:
    - npm ci --prefix website
    - cp -r build website/build
    - npm run --prefix website build
    - mkdir -p public && cp -r website/dist/* public/
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - public/

pages:
  stage: deploy
  needs:
    - build_website
  script:
    - echo "Publishing GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

# -----------------------------------------------------------------------------
# Reporting and notifications
# -----------------------------------------------------------------------------
ci_summary:
  stage: report
  needs:
    - ibex_core_ci
    - ternary_integration
  script:
    - echo "MHX Ternary CI summary" > ci_summary.md
    - echo "Pipeline: ${CI_PIPELINE_ID}" >> ci_summary.md
    - echo "Commit: ${CI_COMMIT_SHA}" >> ci_summary.md
    - echo "Branch: ${CI_COMMIT_REF_NAME}" >> ci_summary.md
    - echo "Generated: $(date -u)" >> ci_summary.md
  artifacts:
    when: always
    expire_in: $ARTIFACTS_EXPIRE
    paths:
      - ci_summary.md

notify_status:
  stage: notify
  needs:
    - ci_summary
  script:
    - echo "Pipeline finished with status ${CI_PIPELINE_STATUS}"
